[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-modeling-ml"
version = "0.1.0"
description = "End-to-end supervised machine learning project for classification and regression with model comparison, confusion matrices, ROC/AUC curves, and bootstrap evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ipykernel>=6.25",
    "nbformat>=5.9",
    "nbclient>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
